<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessing Heart...</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top, #3a0b45, transparent 40%),
    radial-gradient(circle at bottom, #12002b, transparent 50%),
    linear-gradient(135deg,#050014,#16001f,#030008);

    color:#ffb6d9;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}
body::before{

    content:"";

    position:fixed;

    inset:0;

    background-image:
    radial-gradient(#ffffff 1px, transparent 1px);

    background-size:40px 40px;

    opacity:.25;

    animation:stars 20s linear infinite;

}


@keyframes stars{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-200px);
    }

}

/* =========================
   MATRIX BACKGROUND
========================= */

#matrix{
    position:fixed;
    inset:0;
    z-index:-1;
}

/* =========================
   LOADING
========================= */

#loading{

    position:fixed;
    inset:0;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

}

#loading h1{

    margin-bottom:20px;

}

.bar{

    width:320px;
    height:10px;

    background:#222;

    border-radius:30px;

    overflow:hidden;

}

.fill{

    width:0%;
    height:100%;

    background:#00ff99;

    box-shadow:0 0 20px #00ff99;

}

/* =========================
   LOGIN
========================= */

#login{

    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.95);

    justify-content:center;
    align-items:center;
    flex-direction:column;

}

input{

    width:260px;

    margin-top:20px;

    padding:14px;

    border:none;
    outline:none;

    border-radius:12px;

    background:#111;

    color:#00ff99;

    text-align:center;

}

button{

    margin-top:18px;

    padding:12px 35px;

    border:none;

    border-radius:25px;

    cursor:pointer;

    background:#00ff99;

    font-weight:bold;

}

/* =========================
   TERMINAL
========================= */

#terminal{

    display:none;

    width:90%;
    max-width:850px;

    margin:50px auto;

    border:1px solid #00ff99;

    border-radius:15px;

    overflow:hidden;

}

.top{

    background:#111;

    padding:10px;

}

.screen{

    background:#000;

    padding:20px;

    height:420px;

    overflow-y:auto;

    white-space:pre-wrap;

    line-height:1.7;

}

/* =========================
   CONFESSION
========================= */

#confession{

    display:none;

    position:fixed;

    inset:0;

    justify-content:center;
    align-items:center;

}

.card{

    width:90%;
    max-width:700px;

    background:rgba(20,0,30,.65);

border:1px solid #ff4f9a;

box-shadow:
0 0 30px rgba(255,79,154,.5),
inset 0 0 30px rgba(255,79,154,.1);

backdrop-filter:blur(15px);

    border-radius:20px;

    padding:35px;

    text-align:center;

    backdrop-filter:blur(10px);

}

#typing{

    margin-top:20px;

    line-height:1.8;

    min-height:170px;

}

.choice{

    margin-top:35px;

    position:relative;

    height:70px;

}

#yes{

    background:linear-gradient(45deg,#ff4f9a,#ff8acb);

    color:white;

    box-shadow:0 0 20px #ff4f9a;

}

#no{

    position:absolute;

    background:#555;
    color:white;

}

/* =========================
   HEART
========================= */

.heart{

    position:fixed;

    top:-30px;

    color:#ff4f8b;

    pointer-events:none;

    animation:fall linear forwards;

}

@keyframes fall{

    to{

        transform:translateY(110vh) rotate(360deg);

        opacity:0;

    }

}

</style>

</head>

setInterval(drawMatrix,35);

<div id="loading">

<h1>Initializing...</h1>

<div class="bar">

<div class="fill"></div>

</div>

</div>

<div id="login">

<h2>Password Required</h2>

<input id="password" placeholder="Password">

<button id="loginBtn">

ACCESS

</button>

</div>

<div id="terminal">

<div class="top">

🟢 Hacker Terminal

</div>

<div class="screen" id="screen"></div>

</div>

<div id="confession">

<div class="card">

<h1>Hi ❤️</h1>

<p id="typing"></p>

<button id="yes">

YES ❤️

</button>

<button id="no">

NO 💔

</button>

</div>

</div>

</div>
<script>

// ============================
// ELEMENT
// ============================

const loading = document.getElementById("loading");
const login = document.getElementById("login");
const fill = document.querySelector(".fill");

let progress = 0;

// ============================
// LOADING BAR
// ============================

const loadingInterval = setInterval(() => {

    progress++;

    fill.style.width = progress + "%";

    if(progress >= 100){

        clearInterval(loadingInterval);

        setTimeout(() => {

            loading.style.display = "none";
            login.style.display = "flex";

        },500);

    }

},40);


// ============================
// MATRIX EFFECT
// ============================

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ❤#$%&";
const fontSize = 16;

const columns = Math.floor(canvas.width / fontSize);

const drops = [];

for(let i=0;i<columns;i++){

    drops[i]=1;

}

function drawMatrix(){

    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff99";
    ctx.font=fontSize+"px monospace";

    for(let i=0;i<drops.length;i++){

        const text = letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text,i*fontSize,drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > .975){

            drops[i]=0;

        }

        drops[i]++;

    }

}

setInterval(drawMatrix,35);


// ============================
// RESPONSIVE
// ============================

window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

</script>
<script>

// ============================
// LOGIN SYSTEM
// ============================

const loginBtn = document.getElementById("loginBtn");
const password = document.getElementById("password");

const terminal = document.getElementById("terminal");
const screen = document.getElementById("screen");
const confession = document.getElementById("confession");


// GANTI PASSWORD DISINI
const correctPassword = "love";


loginBtn.onclick = () => {

    if(password.value === correctPassword){

        login.style.display="none";
        terminal.style.display="block";

        startTerminal();

    }else{

        password.value="";
        password.placeholder="Wrong Password 💔";

    }

};


// ============================
// TERMINAL ANIMATION
// ============================

const logs = [

"> Connecting to heart database...",
"> Searching feelings...",
"> Accessing memories...",
"> Found someone special ❤️",
"> Loading courage...",
"> Encrypting confession...",
"> Almost ready..."

];


let index = 0;


function startTerminal(){

    let interval=setInterval(()=>{


        screen.innerHTML += logs[index]+"\n";

        index++;


        if(index >= logs.length){

            clearInterval(interval);


            setTimeout(()=>{

                terminal.style.display="none";
                confession.style.display="flex";

                startTyping();


            },1500);


        }


    },700);

}


// ============================
// TYPING CONFESSION
// ============================


const text = 
`Aku sebenarnya udah lama mau bilang ini...

Setiap kali aku lihat kamu,
entah kenapa hari biasa jadi terasa lebih spesial.

Aku nggak tahu kamu bakal ngerasa hal yang sama atau nggak,
tapi aku cuma mau jujur...

Aku suka sama kamu ❤️

Mungkin sederhana,
tapi perasaan ini benar-benar tulus.

Jadi...

maukah kamu mencoba mengenalku lebih dekat?`;


const typing = document.getElementById("typing");


let char = 0;


function startTyping(){

    let type=setInterval(()=>{


        typing.innerHTML += text[char];

        char++;


        if(char >= text.length){

            clearInterval(type);

            hearts();

        }


    },50);


}



// ============================
// BUTTON YES
// ============================


const yes=document.getElementById("yes");
const no=document.getElementById("no");


yes.onclick=()=>{


    typing.innerHTML =
    "❤️ Thank you...<br><br>Aku bakal menghargai kesempatan ini ❤️";


    no.style.display="none";


    hearts();


};



// ============================
// BUTTON NO LARI
// ============================


no.onmouseover=()=>{


    no.style.left =
    Math.random()*250+"px";


    no.style.top =
    Math.random()*50+"px";


};



// ============================
// HEART RAIN
// ============================


function hearts(){


setInterval(()=>{


let heart=document.createElement("div");


heart.className="heart";


heart.innerHTML="❤";


heart.style.left=Math.random()*100+"vw";


heart.style.fontSize=
(15+Math.random()*30)+"px";


heart.style.animationDuration=
(3+Math.random()*4)+"s";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},7000);



},200);



}


</script>
