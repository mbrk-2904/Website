<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- Aurora -->
<div class="aurora">
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
</div>

<!-- Sakura -->
<div id="sakura"></div>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Loading -->

<div id="loading">

<div class="loader"></div>

<h2>Preparing something...</h2>

<p>Please wait 🩷</p>

</div>

<!-- Main -->

<div id="main">

<div class="glass">

<img
class="mofu"

src="assets/mofusand.png"

alt="cat">

<h1 id="title">

Haiii Kamu 👀

</h1>

<p id="typing">

</p>

<button id="next">

Lanjut 💖

</button>

<div id="question" style="display:none;">

<h2>

Aku mau ngomong sesuatu...

</h2>

<p>

Sebenernya...

<br><br>

Aku udah lama suka sama kamu.

🥹❤️

</p>

<div class="buttons">

<button id="yes">

Iya 💕

</button>

<button id="no">

Gamau 😤

</button>

</div>

</div>

</div>

</div>

<!-- Ending -->

<div id="countdown">3</div>

<img
src="assets/photo.jpg"
class="photo"
id="photo">

<h1 id="endTitle"></h1>

<p id="endText"></p>

<button id="restart">
Ulangi Lagi 💖
</button>

<h1>

YEAYYYYY

🥹💖

</h1>

<img

src="assets/photo.jpg"

class="photo">

<h2>

I hope this is

the beginning

of our story.

❤️

</h2>

</div>

<audio
id="music"
loop>

<source
src="assets/music.mp3"
type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
